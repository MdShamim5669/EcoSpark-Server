services:
  postgres:
    image: postgres:16-alpine
    container_name: ecospark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecospark_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecospark_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecospark_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecospark-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ecospark_hub?schema=public}"
      JWT_SECRET: "${JWT_SECRET:-ecospark-hub-super-secret-jwt-key-2026}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      BCRYPT_SALT_ROUNDS: "12"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:3000}"
      SERVER_URL: "${SERVER_URL:-http://localhost:5000}"
      STORE_ID: "${STORE_ID:-}"
      STORE_PASSWORD: "${STORE_PASSWORD:-}"
      SSL_IS_LIVE: "${SSL_IS_LIVE:-false}"
      PAYMENT_GATEWAY_URL: "${PAYMENT_GATEWAY_URL:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@ecospark.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - ecospark_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  ecospark_network:
    driver: bridge
